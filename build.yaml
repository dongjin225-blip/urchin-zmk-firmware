# Dongle-free Urchin build matrix.
include:
  - board: nice_nano@2.0.0
    shield: urchin_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    # The right half only sends key positions. Normal keymap updates require
    # flashing this central image only; rebuilding the peripheral needlessly
    # tears down the split BLE bond during every update.
    artifact-name: urchin_left_UPDATE_THIS_ONLY
